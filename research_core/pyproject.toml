[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "munim-core"
version = "0.1.0"
description = "Isolated corporate and academic diligence extension with a sandbox action ledger"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.18", "httpx>=0.27", "pydantic>=2.8", "pypdf>=5", "geographiclib>=2"]

[project.optional-dependencies]
llm = ["anthropic>=0.70"]
test = ["pytest>=8"]

[project.scripts]
munim-core = "diligence_core.cli:main"

[tool.setuptools.packages.find]
include = ["diligence_core*"]

[tool.setuptools.package-data]
diligence_core = ["fixtures/*.json", "fixtures/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
